<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JSB request PoC</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; }
    input, button { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 10px; }
    button { background: #1677ff; color: white; border: 0; border-radius: 6px; }
    pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h3>JSB request PoC</h3>

  <label>JSB Name</label>
  <input id="jsbName" value="request">

  <label>Request URL</label>
  <input id="targetUrl" value="https://httpbin.org/get?from=jsb_poc">

  <label>Method</label>
  <input id="method" value="GET">

  <button onclick="runPoC()">Call JSB</button>

  <h4>Result</h4>
  <pre id="log"></pre>

<script>
  function log(msg) {
    const el = document.getElementById('log');
    el.textContent += (typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2)) + '\n';
  }

  function safeKeys(obj) {
    if (!obj) return [];
    const keys = new Set();
    let cur = obj;
    while (cur && cur !== Object.prototype) {
      try {
        Object.getOwnPropertyNames(cur).forEach(k => keys.add(k));
      } catch (e) {}
      cur = Object.getPrototypeOf(cur);
    }
    return Array.from(keys).sort();
  }

  function bridgeKeys() {
    return Object.keys(window).filter(k => /bridge|piper|jsb|toutiao|native|bdx/i.test(k));
  }

  function dumpBridgeObject(name) {
    const obj = window[name];
    log('==== ' + name + ' ====');
    log('type: ' + typeof obj);
    log(safeKeys(obj));
  }

  function buildParams() {
    return {
      url: document.getElementById('targetUrl').value,
      method: document.getElementById('method').value
    };
  }

  function tryCall(name, fn) {
    try {
      const ok = fn();
      if (ok) {
        log('Used bridge API: ' + name);
        return true;
      }
    } catch (e) {
      log(name + ' error: ' + e.message);
    }
    return false;
  }

  function runPoC() {
    document.getElementById('log').textContent = '';

    const method = document.getElementById('jsbName').value || 'request';
    const params = buildParams();

    log('Page URL: ' + location.href);
    log('Bridge keys:');
    log(bridgeKeys());

    dumpBridgeObject('BDXBridge');
    dumpBridgeObject('JS2NativeBridge');
    dumpBridgeObject('ToutiaoJSBridge');
    dumpBridgeObject('Piper');

    log('Calling: ' + method);
    log(params);

    const callback = function(res) {
      log('Callback result:');
      log(res);
    };

    const candidates = [
      ['BDXBridge.call', function() {
        return window.BDXBridge &&
          typeof window.BDXBridge.call === 'function' &&
          (window.BDXBridge.call(method, params, callback), true);
      }],

      ['BDXBridge.invoke', function() {
        return window.BDXBridge &&
          typeof window.BDXBridge.invoke === 'function' &&
          (window.BDXBridge.invoke(method, params, callback), true);
      }],

      ['BDXBridge.callHandler', function() {
        return window.BDXBridge &&
          typeof window.BDXBridge.callHandler === 'function' &&
          (window.BDXBridge.callHandler(method, params, callback), true);
      }],

      ['BDXBridge.send', function() {
        return window.BDXBridge &&
          typeof window.BDXBridge.send === 'function' &&
          (window.BDXBridge.send(method, params, callback), true);
      }],

      ['BDXBridge.call x.request', function() {
        return window.BDXBridge &&
          typeof window.BDXBridge.call === 'function' &&
          (window.BDXBridge.call('x.request', params, callback), true);
      }],

      ['BDXBridge.invoke x.request', function() {
        return window.BDXBridge &&
          typeof window.BDXBridge.invoke === 'function' &&
          (window.BDXBridge.invoke('x.request', params, callback), true);
      }],

      ['ToutiaoJSBridge.call', function() {
        return window.ToutiaoJSBridge &&
          typeof window.ToutiaoJSBridge.call === 'function' &&
          (window.ToutiaoJSBridge.call(method, params, callback), true);
      }],

      ['ToutiaoJSBridge.invokeMethod', function() {
        return window.ToutiaoJSBridge &&
          typeof window.ToutiaoJSBridge.invokeMethod === 'function' &&
          (window.ToutiaoJSBridge.invokeMethod(method, params, callback), true);
      }],

      ['Piper.invoke', function() {
        return window.Piper &&
          typeof window.Piper.invoke === 'function' &&
          (window.Piper.invoke(method, params, callback), true);
      }]
    ];

    for (const item of candidates) {
      if (tryCall(item[0], item[1])) {
        return;
      }
    }

    log('No callable bridge API matched.');
  }

  document.addEventListener('DOMContentLoaded', function() {
    log('DOM loaded.');
    log('Bridge keys:');
    log(bridgeKeys());
    dumpBridgeObject('BDXBridge');
    dumpBridgeObject('JS2NativeBridge');
  });

  document.addEventListener('ToutiaoJSBridgeReady', function() {
    log('ToutiaoJSBridgeReady fired.');
    log('Bridge keys:');
    log(bridgeKeys());
  });

  document.addEventListener('BDXBridgeReady', function() {
    log('BDXBridgeReady fired.');
    log('Bridge keys:');
    log(bridgeKeys());
  });
</script>
</body>
</html>
