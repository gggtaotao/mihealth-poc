<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JSB request PoC</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; }
    input, button { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 10px; }
    button { background: #1677ff; color: white; border: 0; border-radius: 6px; }
    pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h3>JSB request PoC</h3>

  <label>JSB Name</label>
  <input id="jsbName" value="request">

  <label>Request URL</label>
  <input id="targetUrl" value="https://httpbin.org/get?from=jsb_poc">

  <label>Method</label>
  <input id="method" value="GET">

  <button onclick="runPoC()">Call JSB</button>

  <h4>Result</h4>
  <pre id="log"></pre>

  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += (typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2)) + '\n';
    }

    function bridgeKeys() {
      return Object.keys(window).filter(k => /bridge|piper|jsb|toutiao|native/i.test(k));
    }

    function tryCallBridge(method, params, callback) {
      const candidates = [
        ['ToutiaoJSBridge.call', () => window.ToutiaoJSBridge && window.ToutiaoJSBridge.call && window.ToutiaoJSBridge.call(method, params, callback)],
        ['ToutiaoJSBridge.invokeMethod', () => window.ToutiaoJSBridge && window.ToutiaoJSBridge.invokeMethod && window.ToutiaoJSBridge.invokeMethod(method, params, callback)],
        ['Piper.invoke', () => window.Piper && window.Piper.invoke && window.Piper.invoke(method, params, callback)],
        ['JSBridge.call', () => window.JSBridge && window.JSBridge.call && window.JSBridge.call(method, params, callback)],
        ['WebViewJavascriptBridge.callHandler', () => window.WebViewJavascriptBridge && window.WebViewJavascriptBridge.callHandler && window.WebViewJavascriptBridge.callHandler(method, params, callback)]
      ];

      for (const [name, fn] of candidates) {
        try {
          const ret = fn();
          if (ret !== undefined) return name;
        } catch (e) {
          log(name + ' error: ' + e.message);
        }
      }
      return null;
    }

    function runPoC() {
      document.getElementById('log').textContent = '';

      const method = document.getElementById('jsbName').value;
      const params = {
        url: document.getElementById('targetUrl').value,
        method: document.getElementById('method').value
      };

      log('Page URL: ' + location.href);
      log('Bridge keys:');
      log(bridgeKeys());
      log('Calling: ' + method);
      log(params);

      const used = tryCallBridge(method, params, function(res) {
        log('Callback result:');
        log(res);
      });

      if (used) {
        log('Used: ' + used);
      } else {
        log('No known bridge API found.');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      log('DOM loaded.');
      log('Bridge keys:');
      log(bridgeKeys());
    });

    document.addEventListener('ToutiaoJSBridgeReady', function() {
      log('ToutiaoJSBridgeReady fired.');
      log('Bridge keys:');
      log(bridgeKeys());
    });
  </script>
</body>
</html>
